services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: flowstock-app
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - flowstock

  nginx:
    image: nginx:stable-alpine
    container_name: flowstock-nginx
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - flowstock

  postgres:
    image: postgres:16
    container_name: flowstock-postgres
    environment:
      POSTGRES_DB: flowstock
      POSTGRES_USER: flowstock
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - flowstock-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowstock -d flowstock"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flowstock

  redis:
    image: redis:7-alpine
    container_name: flowstock-redis
    ports:
      - "6379:6379"
    networks:
      - flowstock

networks:
  flowstock:
    driver: bridge

volumes:
  flowstock-postgres-data:
