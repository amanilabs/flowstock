services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: flowstock-app:dev
    container_name: flowstock-app
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - flowstock

  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: flowstock-app:dev
    container_name: flowstock-queue-worker
    command: php artisan queue:work redis --queue=default --tries=3 --backoff=10 --max-time=3600 --sleep=3
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - flowstock

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: flowstock-app:dev
    container_name: flowstock-scheduler
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - flowstock

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: flowstock-app:dev
    container_name: flowstock-reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=6001
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    ports:
      - "6001:6001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - flowstock

  nginx:
    image: nginx:stable-alpine
    container_name: flowstock-nginx
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - flowstock

  postgres:
    image: postgres:16
    container_name: flowstock-postgres
    environment:
      POSTGRES_DB: flowstock
      POSTGRES_USER: flowstock
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - flowstock-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowstock -d flowstock"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flowstock

  redis:
    image: redis:7-alpine
    container_name: flowstock-redis
    ports:
      - "6379:6379"
    networks:
      - flowstock

networks:
  flowstock:
    driver: bridge

volumes:
  flowstock-postgres-data:
