services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    image: flowstock-app:prod
    container_name: flowstock-app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - flowstock

  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    image: flowstock-app:prod
    container_name: flowstock-queue-worker
    command: php artisan queue:work redis --queue=default --tries=3 --backoff=10 --max-time=3600 --sleep=3
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - flowstock

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    image: flowstock-app:prod
    container_name: flowstock-scheduler
    command: php artisan schedule:work
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - flowstock

  nginx:
    image: nginx:stable-alpine
    container_name: flowstock-nginx
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - flowstock

  postgres:
    image: postgres:16
    container_name: flowstock-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - flowstock-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - flowstock

  redis:
    image: redis:7-alpine
    container_name: flowstock-redis
    restart: unless-stopped
    networks:
      - flowstock

networks:
  flowstock:
    driver: bridge

volumes:
  flowstock-postgres-data:
