upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 120
opcache.enable = 1
; validate_timestamps=1 (even with revalidate_freq raised) still forces a
; periodic filesystem stat() sweep across every opcache-cached file touched
; by a request, over a Windows bind mount — that's ~1.5-2s, recurring every
; time the revalidation window elapses. Disabling it (matching prod) removes
; the tax entirely and consistently. Trade-off: PHP code edits are no longer
; auto-detected — run `docker compose restart app` (fast, no rebuild, since
; source is bind-mounted not baked into the image) after editing backend
; PHP to see changes take effect.
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256
