[www]
; With pm=dynamic (the image default), FPM kills idle workers and spawns
; fresh ones under load — every freshly-spawned worker has its own empty
; opcache and pays a full first-hit compile of the whole framework
; (~1.5-2s over the slow Windows bind mount) before it's warm. A small
; static pool is created once at container start and never recycled, so
; that cold-compile cost only happens once per worker instead of
; recurring unpredictably throughout a dev session.
pm = static
pm.max_children = 4
